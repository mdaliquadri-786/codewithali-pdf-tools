name: Automated PDF Tools Tester

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run live PDF tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deployment
        shell: bash
        run: |
          set -u

          url="https://codewithali-pdf-tools.vercel.app/tools/merge"

          for attempt in {1..30}; do
            status=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$url" || true
            )

            if [ "$status" = "200" ]; then
              echo "Vercel deployment is reachable."
              exit 0
            fi

            echo "Deployment returned HTTP $status."
            echo "Retrying in 10 seconds... Attempt $attempt/30."
            sleep 10
          done

          echo "Deployment did not become ready within five minutes."
          exit 1

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: ignore
